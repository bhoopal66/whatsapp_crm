version: 2
updates:
  # Runtime + dev dependencies. Weekly on Mondays, batched into three
  # pull requests: the Supabase client libraries, everything else that
  # ships, and everything that does not.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      supabase:
        patterns:
          - "@supabase/*"
      # One version across the family: a single package alone breaks npm ci.
      fullcalendar:
        patterns:
          - "@fullcalendar/*"
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Next, React and Tailwind are pinned exactly on purpose: they move
      # by hand, together, with a full check.
      - dependency-name: next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: tailwindcss
      - dependency-name: eslint-config-next
      # eslint-plugin-react (inside eslint-config-next) crashes on ESLint
      # 10: "contextOrFilename.getFilename is not a function" (2026-11-23).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # FullCalendar 7 is a rewrite of its API and styles: by hand.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      # The safety layer's wire format is pinned and tested against it.
      - dependency-name: "@typesafe-ai/sdk"
      # web-push 4 is ESM with named exports only: the import, its types
      # and a real delivery have to move together.
      - dependency-name: web-push
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler: needs the whole toolchain.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The MCP server is a package of its own with its own lockfile.
  - package-ecosystem: npm
    directory: "/mcp-server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      mcp-server:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions in .github/workflows/. Catches setup-node /
  # checkout version bumps that keep the CI matrix healthy.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # The Dockerfile's Node base image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - dependencies
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
