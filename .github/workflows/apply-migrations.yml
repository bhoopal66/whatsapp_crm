# Apply a range of supabase/migrations files to the LIVE database, by hand.
#
# Run it from Actions → "Apply migrations" → Run workflow, choosing the
# branch whose migrations you want (the files come from that branch).
#
#   mode = check  reads only: the connecting role, which migrations'
#                 objects already exist, and the ledger status of FROM..TO
#                 (scripts/apply-migrations.sh --status: applied / changed
#                 / not recorded, migration 338). Run this first.
#   mode = apply  runs scripts/apply-migrations.sh FROM TO: each file in
#                 order, stopping at the first error, recorded in the
#                 ledger. Stops before applying anything if a recorded file
#                 changed since. Needs confirm = APPLY.
#
# Needs the repository secret DATABASE_URL: the database connection string
# of a superuser or BYPASSRLS role. On supabase.com use the "Session pooler"
# string (IPv4; GitHub's runners cannot reach the IPv6-only direct host).
#
# No pg_dump here: a dump would leave customer data on a runner or in an
# artifact. Take a backup or snapshot in the Supabase dashboard first; the
# APPLY confirmation is that promise.
name: Apply migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (read only) or apply'
        required: true
        default: check
        type: choice
        options: [check, apply]
      from:
        description: 'First migration number (e.g. 236)'
        required: true
      to:
        description: 'Last migration number (e.g. 256)'
        required: true
      confirm:
        description: 'For apply: type APPLY to confirm a fresh backup exists'
        required: false

permissions:
  contents: read

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      CONFIRM: ${{ inputs.confirm }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the inputs and the secret
        run: |
          [[ "$FROM" =~ ^[0-9]{1,3}$ && "$TO" =~ ^[0-9]{1,3}$ ]] || { echo "from and to must be migration numbers"; exit 1; }
          (( 10#$FROM <= 10#$TO )) || { echo "from must not be after to"; exit 1; }
          [[ -n "$DATABASE_URL" ]] || { echo "Add the repository secret DATABASE_URL first"; exit 1; }
          if [[ "$MODE" == apply && "$CONFIRM" != APPLY ]]; then
            echo "apply needs confirm = APPLY (after taking a backup)"; exit 1
          fi

      - uses: actions/checkout@v7

      - name: Show the role and what is already there
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "select current_user as role, (select rolsuper from pg_roles where rolname = current_user) as superuser, (select rolbypassrls from pg_roles where rolname = current_user) as bypassrls, version()"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "
            select m as migration, present from (values
              ('220', to_regclass('public.intake_items') is not null),
              ('225', to_regproc('public.case_review_draft_create') is not null),
              ('228', to_regproc('public.hr_automsg_outbox_stats') is not null),
              ('229', to_regclass('public.privacy_extensions') is not null),
              ('230', to_regclass('public.desk_settings') is not null),
              ('231', to_regclass('public.desk_doc_consents') is not null),
              ('232', to_regclass('public.desk_bank_roles') is not null),
              ('233', to_regproc('public.desk_case_doc_cell') is not null),
              ('234', to_regclass('public.desk_digest_settings') is not null),
              ('235', to_regproc('public.desk_worklist') is not null),
              ('236', to_regclass('public.assignment_settings') is not null),
              ('241', to_regclass('public.conversation_notes') is not null),
              ('249', to_regclass('public.web_lead_forms') is not null),
              ('255', to_regclass('public.report_access') is not null),
              ('256', to_regclass('public.broadcast_drafts') is not null),
              ('257', to_regproc('public.contacts_sorted_page') is not null),
              ('259', to_regproc('public.set_my_language') is not null),
              -- 261 drops the per-chat helper 254 created.
              ('261', to_regproc('public.funnel_report') is not null and to_regproc('public.funnel_chat_reached_tag') is null)
            ) t(m, present) order by m"
          # 262 on: one object each file creates first (a function by name,
          # as some are overloaded), or, for a file that only restates, a
          # phrase its body adds. Files with neither are left out.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "
            with fn(name) as (select proname from pg_proc where pronamespace = 'public'::regnamespace),
            src(name, body) as (select proname, prosrc from pg_proc where pronamespace = 'public'::regnamespace)
            select m as migration, present from (values
              ('262', exists (select 1 from fn where name = 'contacts_legal_hold_guard')),
              ('264', to_regclass('public.webhook_inbox') is not null),
              ('265', exists (select 1 from fn where name = 'member_lately_admin')),
              ('266', exists (select 1 from fn where name = 'member_handover')),
              ('267', exists (select 1 from fn where name = 'sg_reconcile_echo')),
              ('269', exists (select 1 from fn where name = 'automation_save')),
              ('274', exists (select 1 from fn where name = 'deal_room_ring_message')),
              ('275', exists (select 1 from fn where name = 'hr_automsg_stale_reason')),
              ('278', exists (select 1 from fn where name = 'calendar_bell_body')),
              ('279', exists (select 1 from fn where name = 'hr_is_line')),
              ('280', to_regclass('public.contact_suppression_keys') is not null),
              ('281', exists (select 1 from fn where name = 'case_csat_handoff')),
              ('282', exists (select 1 from fn where name = 'privacy_media_objects')),
              ('284', exists (select 1 from fn where name = 'conversations_session_guard')),
              ('286', exists (select 1 from fn where name = 'contact_notes_frozen')),
              ('287', exists (select 1 from fn where name = 'member_lately_admin_in')),
              ('288', to_regclass('public.login_email_permits') is not null),
              ('290', to_regclass('public.kb_learn_settings') is not null),
              ('292', exists (select 1 from fn where name = 'backfill_message_failure_reasons')),
              ('293', exists (select 1 from fn where name = 'webhook_endpoint_streak')),
              ('294', exists (select 1 from fn where name = 'pbx_answered_call')),
              ('296', exists (select 1 from fn where name = 'dashboard_open_deal_values')),
              ('297', to_regclass('public.case_doc_requests') is not null),
              ('299', exists (select 1 from fn where name = 'staff_removal_phone')),
              ('300', exists (select 1 from fn where name = 'flow_save')),
              ('301', exists (select 1 from fn where name = 'broadcast_recipients_stopped_guard')),
              ('302', exists (select 1 from fn where name = 'hr_automsg_due_page')),
              ('303', exists (select 1 from fn where name = 'desk_tray_copy_failed')),
              ('305', to_regclass('public.v1_message_keys') is not null),
              ('307', exists (select 1 from fn where name = 'chat_assert_not_sensitive')),
              ('308', exists (select 1 from fn where name = 'sg_user_sees_contact')),
              ('312', exists (select 1 from fn where name = 'deal_room_open_to_guest')),
              ('314', exists (select 1 from fn where name = 'whatsapp_channel_restrict')),
              ('315', exists (select 1 from fn where name = 'api_key_webhooks_off')),
              ('316', exists (select 1 from fn where name = 'customer_documents_stats')),
              ('317', exists (select 1 from fn where name = 'privacy_unlinked_task_ids')),
              ('318', to_regclass('public.kb_learn_skills') is not null),
              ('319', exists (select 1 from fn where name = 'calendar_events_stale_bells')),
              ('322', exists (select 1 from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname = 'WhatsApp media is uploaded by agents and up')),
              ('323', to_regclass('public.inbox_assistant_settings') is not null),
              ('324', to_regclass('public.automation_time_runs') is not null),
              ('326', exists (select 1 from fn where name = 'response_reply_status_changed')),
              ('327', exists (select 1 from fn where name = 'automated_sends_today')),
              ('328', exists (select 1 from fn where name = 'desk_leave_change')),
              ('329', exists (select 1 from pg_proc where proname = 'desk_tray_page' and 'p_q' = any (proargnames))),
              ('330', exists (select 1 from src where name = 'report_access_set' and body like '%deactivated_at IS NOT NULL%')),
              ('331', exists (select 1 from src where name = 'contacts_sorted_page' and body like '%''unknown''%')),
              ('332', exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'conversation_notes' and column_name = 'deleted_at')),
              ('333', exists (select 1 from src where name = 'sg_can_send' and body like '%sg_archive_role%')),
              ('334', to_regclass('public.send_protection_decisions') is not null),
              ('335', exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'hr_workflow_rules' and column_name = 'title_ar')),
              ('336', to_regclass('public.pbx_service_details_settings') is not null),
              ('338', to_regclass('public.migration_ledger') is not null)
            ) t(m, present) order by m"

      # 338 on: which files in FROM..TO the ledger records, and whether a
      # recorded file changed since (apply then stops unless ALLOW_DRIFT).
      - name: Show the ledger status
        if: inputs.mode == 'check'
        run: scripts/apply-migrations.sh --status "$FROM" "$TO"

      - name: Apply the migrations
        if: inputs.mode == 'apply'
        env:
          SKIP_BACKUP: '1'
        run: scripts/apply-migrations.sh "$FROM" "$TO"
