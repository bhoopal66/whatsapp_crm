name: Migrations

# Replaces the "Supabase Preview" check, which never worked: it fired
# only on migration changes and then either 404'd in four seconds
# ("Postgres config not found") or hung forever waiting on a branch
# action, because two stale dashboard integrations were pointed at this
# repo and neither could provision. It never applied a migration, so
# every `supabase/migrations/*.sql` file in this repo has shipped
# unexecuted by CI.
#
# This job does the thing that check only claimed to: boot a clean
# Postgres and replay every migration, in order, from nothing. It needs
# no secrets and no Supabase account — the CLI runs the database in a
# container on the runner.

on:
  pull_request:
    # `supabase/**` rather than `supabase/migrations/**` so a change to
    # config.toml re-runs the check too, and this workflow is listed so
    # that edits to the check are validated by the check.
    #
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

# Read-only token: the job needs no secrets and writes nothing back.
permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned rather than `latest`: this check is infrastructure,
          # and a CLI release changing behaviour should be a deliberate
          # bump in a PR, not a Tuesday where main goes red.
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      # An empty database: supabase/config.toml turns the CLI's own
      # migration runner off (see below), so `db reset` only rebuilds
      # the Supabase base schema. --no-seed: there is no seed script.
      - name: Reset to an empty database
        run: supabase db reset --local --no-seed

      # The default grants a classic Supabase project gives the API
      # roles, which the migrations and verify files assume and the
      # CLI's current image no longer sets (supabase/ci/classic-grants.sql
      # says why). Before the first migration, so every object they
      # create gets them, as in production.
      - name: Restore Supabase's classic default grants
        run: psql "$CI_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci/classic-grants.sql
        env:
          CI_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Every migration in filename order against nothing, through psql
      # in autocommit, the way they are applied by hand. Not the CLI's
      # runner: it wraps each file in one transaction, and 044 adds an
      # enum value and uses it in the same file, which Postgres refuses
      # inside a transaction (hence `enabled = false` in config.toml).
      # Stops at the first statement Postgres rejects.
      - name: Replay every migration from scratch
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql "$CI_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
        env:
          CI_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql

      # Schema checks prove the objects exist; they cannot prove the
      # money is right. The costing rules live inside
      # `record_whatsapp_message_cost` (migration 051) — the rate card,
      # the market map, the 2026-10-01 free tier, Meta's `billable`
      # override — so `npm test` cannot reach them and a wrong number
      # here is silent by nature: it under-reports spend and nothing
      # errors. This drives the function with real receipt shapes and
      # asserts the resulting ledger rows.
      - name: Verify the message-cost ledger
        run: supabase db query --local --file supabase/ci/verify-message-costs.sql

      # The TypeSafe decision layer (063) keeps its safety rules in SQL:
      # four-eyes policy activation, per-account isolation, an
      # append-only decision log whose only permitted change is the
      # retention purge. The vitest suite runs the checks against an
      # in-memory store, so none of that is reachable from `npm test`.
      - name: Verify the TypeSafe decision layer
        run: supabase db query --local --file supabase/ci/verify-typesafe.sql

      - name: Verify team activity
        run: supabase db query --local --file supabase/ci/verify-team-activity.sql

      # Team leaders (074) get Team activity scoped to their own team.
      # The scope is a filter inside the SQL report, so only real
      # Postgres can show a leader sees no one else's figures.
      - name: Verify team activity for team leaders
        run: supabase db query --local --file supabase/ci/verify-team-activity-leaders.sql

      # Hard restrictions (204): each rule on its own, the owner-only
      # exemption, company phone numbers only, and who reads the blocks.
      - name: Verify team activity hard restrictions
        run: supabase db query --local --file supabase/ci/verify-team-activity-enforcement.sql

      - name: Verify team activity unlock requests
        run: supabase db query --local --file supabase/ci/verify-team-activity-unlocks.sql

      # The new chat notice (207): admins write, members read through
      # the RPC; a personal or another account's number is refused.
      - name: Verify new chat notice
        run: supabase db query --local --file supabase/ci/verify-new-chat-notice.sql

      # Deactivation (069) is enforced in the RLS helpers and the
      # profile guard, so a deactivated member's still-valid access
      # token reads nothing. Only real Postgres can show that.
      - name: Verify member deactivation
        run: supabase db query --local --file supabase/ci/verify-member-deactivation.sql

      # Team number allocation (071) derives whatsapp_channel_members
      # rows from team membership in triggers, so a team change grants
      # or revokes a number with no app code involved. Only real
      # Postgres can show the derivation, the cascades and the grants.
      - name: Verify team number allocation
        run: supabase db query --local --file supabase/ci/verify-team-numbers.sql

      # Chat tags (075): one main tag and one sub-tag of it per chat.
      # The pairing rule, the one-level nesting and the delete cascade
      # live in triggers and composite FKs, and the write rules in RLS,
      # so only real Postgres can show them.
      - name: Verify chat tags
        run: supabase db query --local --file supabase/ci/verify-chat-tags.sql

      # A contact's opt-out (076) is what every broadcast trusts to skip
      # a customer who asked to stop. Only an admin, the service role or
      # a server job may change it — a trigger, because contacts_update
      # lets any agent write the row — so only real Postgres can show an
      # agent is refused while other contact fields stay writable.
      - name: Verify contact opt-out
        run: supabase db query --local --file supabase/ci/verify-contact-opt-out.sql

      # AI agent v2 (077): a person's reply pauses the bot through a
      # messages trigger, and only an agent message with a sender_id
      # counts. Only real Postgres can show the trigger fires, refreshes
      # its own pause and leaves a hand-off alone.
      - name: Verify AI agent v2
        run: supabase db query --local --file supabase/ci/verify-ai-agent-v2.sql

      # Partner banks and needs-attention (078): partner_banks has a
      # shape CHECK and is written through the admin-only settings RLS,
      # and a person's reply clears ai_attention_at through 077's
      # messages trigger function — even with no AI config. Only real
      # Postgres can show the trigger and the policies.
      - name: Verify partner banks and needs-attention
        run: supabase db query --local --file supabase/ci/verify-partner-banks-attention.sql

      # Reply on every number (079): the switch is a NOT NULL boolean
      # defaulting to false, so an account that never saves it keeps the
      # routed-number bot.
      - name: Verify AI reply on every number
        run: supabase db query --local --file supabase/ci/verify-ai-all-numbers.sql

      # Pipelines for everyone (080): a deal is visible to its owner,
      # their team leader and admins, and tagging a chat with a stage's
      # linked tag opens one deal there. The rule lives in RLS and the
      # deal comes from a conversations trigger, so only real Postgres
      # can show who sees what and that re-tagging never duplicates.
      # Since 138 a re-tag moves the open deal and the title carries the
      # sub-tag (a hand-made title is kept).
      - name: Verify pipeline deals
        run: supabase db query --local --file supabase/ci/verify-pipeline-deals.sql

      # Approved answers (081): a placeholder can never be approved, the
      # bot's shortlist never returns internal-staff or unapproved rows,
      # and only admins write or import. All of it is a CHECK, a trigger,
      # RLS or a SECURITY DEFINER function, so only real Postgres can
      # show it.
      - name: Verify approved answers
        run: supabase db query --local --file supabase/ci/verify-approved-answers.sql

      # Edge security (084): the webhook replay keys, the sliding-window
      # rate limiter and the admin lockout are advisory-locked functions
      # over service-role-only tables. Only real Postgres can show the
      # window prunes, a lapsed claim is taken over, a success clears
      # only its own pair, and anon/authenticated are refused.
      - name: Verify edge security
        run: supabase db query --local --file supabase/ci/verify-edge-security.sql

      # Journey bot host (086): a commit lands file, event id and outbox
      # together, a replay is 'duplicate' whatever its version, and only
      # an agent who can see a customer touches their consent, with an
      # append-only history. Functions, triggers, RLS and grants: only
      # real Postgres can show it.
      - name: Verify journeys
        run: supabase db query --local --file supabase/ci/verify-journeys.sql

      # Workspaces (082-083): one person can hold a profile row in several
      # accounts and switch the active one; every existing policy keeps
      # meaning "the caller's ACTIVE account", and a bank guest is closed
      # out of all of them. Isolation is RLS plus SECURITY DEFINER
      # helpers, so only real Postgres can show it.
      - name: Verify workspaces
        run: supabase db query --local --file supabase/ci/verify-workspaces.sql

      # Workspace audit log (092): triggers on profiles and accounts write
      # one row per membership or settings change, with its actor, for
      # every writer (the RPCs, the service role, a hand-run UPDATE);
      # nobody can rewrite or delete a row, and only the workspace's live
      # admins read them. Also 092's accounts column grants. Triggers, RLS
      # and grants: only real Postgres can show it.
      - name: Verify workspace audit
        run: supabase db query --local --file supabase/ci/verify-workspace-audit.sql

      # Tasks (085): who sees a task is RLS (admins all, the assignee,
      # the creator, whoever can see its contact, a leader their team),
      # and a trigger vets the assignee, freezes a task's identity and
      # stamps completion for every writer, the service role included.
      # Only real Postgres can show who sees what, that a redelivered
      # system task is refused and that assigning rings the bell.
      - name: Verify tasks
        run: supabase db query --local --file supabase/ci/verify-tasks.sql

      # Internal chat (087): channels, DMs, threads, mentions and shared
      # customer-chat cards are RLS plus SECURITY DEFINER functions over
      # membership in the channel's workspace. A bank guest sees a deal
      # room but never its Team notes; a shared card shows its live
      # status only to someone who can open the chat in the inbox. Only
      # real Postgres can show it.
      - name: Verify internal chat
        run: supabase db query --local --file supabase/ci/verify-internal-chat.sql

      # Internal chat (087), part 2: channel membership (D-B1), pins,
      # direct writes refused for every role, the audited admin read,
      # erasure, and the private chat-files bucket. RLS and SECURITY
      # DEFINER RPCs are the boundary, so only real Postgres can show it.
      - name: Verify internal chat (admin)
        run: supabase db query --local --file supabase/ci/verify-internal-chat-admin.sql

      # Team-chat channel administration (091): rename, archive and
      # remove for channel admins and workspace owner/admin (from inside
      # a private channel only, D-B1), a person's own mute (only a direct
      # mention rings) and the badges that leave muted unread out.
      - name: Verify chat channel admin
        run: supabase db query --local --file supabase/ci/verify-chat-channel-admin.sql

      # Phone system (089): who sees a call is RLS through
      # pbx_can_view_call (leaders all, the call's people, whoever can
      # see its contact; guests nothing), three SECURITY DEFINER
      # functions re-check the caller, and a recording's play is logged
      # only while it is playable. Only real Postgres can show it.
      - name: Verify phone system
        run: supabase db query --local --file supabase/ci/verify-pbx.sql

      # Call report figures (119): pbx_call_stats counts an owner/admin's
      # whole workspace (a 'none' row for calls with no person), a team
      # leader's teams plus themselves, anyone else their own calls; a
      # person outside that scope is 42501, another workspace never
      # counts; the figures, previous period, talk buckets, outcomes and
      # the zero-filled days and weekday x hour grid in the caller's time
      # zone are checked against a hand-computed fixture.
      - name: Verify call report figures
        run: supabase db query --local --file supabase/ci/verify-pbx-call-stats.sql

      # Deal rooms (088): WhatsApp groups on the Meta number, linked to a
      # contact. Consent before any group, at most 8 members, opted-out
      # and do-not-contact people refused, bank guests per bank and with
      # a leader's approval, guests kept to the roster and group
      # messages, no phone or invite link readable by any client, and the
      # service-role functions. RLS, column grants and SECURITY DEFINER
      # functions are the boundary, so only real Postgres can show it.
      - name: Verify deal rooms
        run: supabase db query --local --file supabase/ci/verify-deal-rooms.sql

      # Video meetings (106): who sees a meeting is meeting_can_view
      # (owner/admin, the host, an invitee, or the workspace when it is
      # open; a bank guest nothing), a guard freezes host and workspace
      # and makes ended/cancelled terminal for every writer, participant
      # rows are service-role only, and an invitation rings the bell.
      # 107: in-room chat and reactions read as the meeting is, posted
      # only through meeting_post_message (visible, scheduled, a valid
      # kind and body, rate-limited), and the seat's hand and moderation
      # columns stay service-role only.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify meetings
        run: supabase db query --local --file supabase/ci/verify-meetings.sql

      # Meeting host tools (176): the lock and recording columns are the
      # service role's alone, on INSERT too, and a manager's edit is
      # unchanged; a meeting that is not scheduled shows no recording, for
      # every writer. Notes read as the meeting is and are saved only
      # through meeting_save_notes (compare-and-set, MN001 STALE; a manager
      # only after the end). Deleting a host's login that stamped its own
      # meeting succeeds: those uuids have no foreign key (117).
      - name: Verify meeting host tools
        run: supabase db query --local --file supabase/ci/verify-meeting-host-tools.sql

      # Web push (109): no client reads the outbox and the dispatcher's
      # functions are the service role's; a person manages only their own
      # devices and preferences; every writer skips a person with no
      # device, push or the kind switched off, or no live profile; bell
      # rows push (never the chat_* types), team-chat messages push every
      # reader but the author (a muted member only when @mentioned, a bank
      # guest never from deal-room notes), WhatsApp inbound goes to the
      # assignee, else the number's people, else owners and admins.
      - name: Verify push
        run: supabase db query --local --file supabase/ci/verify-push.sql
      # Calendar (108): who sees an event is calendar_event_can_view
      # (creator, attendees, the workspace when it is 'workspace', and
      # owner/admin unless 'private'; a bank guest nothing), only the
      # creator edits it (admins included), an attendee writes only their
      # own response and reminders, the invite / update / cancel /
      # response bells reach the right people, and the reminder sweep
      # rings once per key and never a declined attendee.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify calendar
        run: supabase db query --local --file supabase/ci/verify-calendar.sql

      # WhatsApp groups (114): owner/admin see every group, else the
      # creator, a manager, or the leader of a team either is in; another
      # agent, a bank guest and another workspace see nothing; managing
      # needs the number (can_use_channel); the invite link reads only
      # for managers; no client writes; a group lives on a Whapi number
      # of its own workspace (Whapi or company OpenWA since 208).
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify WhatsApp groups
        run: supabase db query --local --file supabase/ci/verify-whatsapp-groups.sql

      # Group read markers (146): the unread count goes 1 -> 0 on
      # mark_read; outbound, a left group and another person's marker
      # never count; mark_read refuses a group the caller cannot see and
      # never moves back; clients write no marker directly.
      - name: Verify WhatsApp group reads
        run: supabase db query --local --file supabase/ci/verify-whatsapp-group-reads.sql

      # Submission groups (115): identity frozen, wa_group_id once under a
      # claim, ENDED frozen but for the close bookkeeping; out rows born
      # pending and settled once, post_end set by the trigger; the
      # supervisor window (coordinator / team_lead on the list at the
      # end, until ended_at + 60 days exclusive), owner/admin always,
      # agents never; sg_read_archive audits allowed reads only; the
      # audit is append-only; no direct writes, the service role's
      # included.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify submission groups
        run: supabase db query --local --file supabase/ci/verify-submission-groups.sql

      # Bank coordinators in submission groups (163): on an ACTIVE group
      # a live agent / team leader holding the case's bank reads, lists
      # and sends as an open 'coordinator' row; a real open row keeps its
      # label; ENDED groups stay with the list at the end.
      - name: Verify bank coordinator submissions
        run: supabase db query --local --file supabase/ci/verify-bank-coordinator-submissions.sql

      # Submissions without a WhatsApp group (136): a 'none' row has no
      # hosting number, its mode is frozen, it is never claimed for a
      # create or sent into, sg_end still ends it; the per-account
      # submission_whatsapp_groups switch defaults to off and is set by
      # an owner/admin only.
      - name: Verify submissions without WhatsApp groups
        run: supabase db query --local --file supabase/ci/verify-submission-no-whatsapp.sql

      # Automatic messages in a submission group (170): a welcome once
      # per group and the tracker's status updates, with no sender and
      # a key unique per group; a group ENDED by a final status takes
      # status updates for a 2-day close hold, a manual end none.
      - name: Verify submission group system messages
        run: supabase db query --local --file supabase/ci/verify-submission-system-messages.sql

      # Submission customer name (141): sg_open stores customer.name on
      # the group; case_inbox names that customer, else the contact.
      - name: Verify the submission's customer name
        run: supabase db query --local --file supabase/ci/verify-submission-customer-name.sql

      # Cases (122): roles resolved live (owner, admin, the agent's team
      # lead, the named coordinator and agent; nobody else), reads in the
      # active workspace, writes and reassigns by role; stage lists
      # validated at commit and STAGE_IN_USE; final stages close the case
      # and only the first final move takes the group-end claim, whose
      # token release / finish need; a repeat case_open never fails over
      # a bank it cannot fill; supervisor views audited and read only
      # through case_audit_list; history and audit append-only for every
      # writer; no API role writes a case table.
      - name: Verify cases
        run: supabase db query --local --file supabase/ci/verify-cases.sql

      # Case leads (130): a lead opens at Interested with no group, once
      # per open (contact, bank), for a contact the agent can see, by the
      # agent, an admin or the agent's leader; pre-submission stages move
      # freely and are never re-entered, a lead leaves them only to
      # Withdrawn; case_open attaches a group to the open lead (same case,
      # one history row, timers reset); a lead has no group to end;
      # NO_RESPONSE is a Withdrawn reason only; stored lists start with
      # the three pre-submission stages.
      - name: Verify case leads
        run: supabase db query --local --file supabase/ci/verify-case-leads.sql

      # Compass case sync (134): case_sync_from_submission applies the
      # submission app's stage / details / documents as the API (no case
      # and stale updates write nothing; UNKNOWN_STAGE, PRESUB_REENTRY,
      # FINAL_STAGE; unknown documents reported, not raised);
      # managed_externally locks a person's case_set_stage on a submitted
      # case, never a lead or the API path; the outbox queues only for a
      # subscribed active endpoint and hands each row out once;
      # compass_link_contact_by_phone links once.
      - name: Verify Compass case sync
        run: supabase db query --local --file supabase/ci/verify-compass-sync.sql

      # Security hardening (135): agents cannot write automations, flows,
      # broadcasts or their child rows (admins can); nobody edits their
      # own profiles.email; peek_invitation refuses archived-workspace
      # and orphaned-creator links; teams take live staff only.
      - name: Verify security hardening
        run: supabase db query --local --file supabase/ci/verify-security-hardening.sql

      # Bank dashboard after leads (131): pre-submission vs with-bank,
      # account openings (amount NULL / 0) counted vs financing summed,
      # lead conversion over the actor's readable cases only;
      # bank_ws_cases open and most overdue first with contact, SLA and
      # lead columns; bank_ws_summary counts, NULL without access.
      - name: Verify bank dashboard leads
        run: supabase db query --local --file supabase/ci/verify-bank-dashboard-leads.sql

      # Vault (121): a vault role counts only while its holder is a live
      # owner/admin of the account; bootstrap only for a live owner of an
      # account with no role, grant / revoke only by a super_admin, never
      # the last one; put dedupes per (account, kind, blind index) under a
      # random token and refuses CARD / CVV / OTP / PIN; reveal needs a
      # role and an identifier-free reason, 20 attempts per actor per
      # hour; delete wipes the payload; rewrap is super_admin only with
      # keyset paging and CONFLICT on a stale key id; every attempt is
      # audited, never with a value; the audit is append-only and item
      # identity fixed, the owner included; no API role holds a table
      # privilege and only service_role executes the 11 API functions.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify vault
        run: supabase db query --local --file supabase/ci/verify-vault.sql

      # Case tools (123): tasks only from a template of the case's own
      # account and bank, owned by someone who may act on the case, due
      # the clock + due_hours and never infinite, every status a log row,
      # overdue computed over readable cases; documents from the case's
      # own account / bank / product (case-insensitive, trimmed), file
      # refs ids only; notes store only lowercase @<uuid> mentions of
      # case members; config owner/admin only; log, notes and mentions
      # append-only and tasks / documents untruncatable for every writer;
      # no API role writes a 123 table, only service_role executes 123.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify case tools
        run: supabase db query --local --file supabase/ci/verify-case-tools.sql

      # CRM memory (129): memory_can_read needs a live staff profile in the
      # account (never a bank guest), then owner / admin read every scope,
      # members the workspace, a contact follows 072 (creator, own /
      # assigned chat, their team's leader), a case 122's case_role, plus
      # acl rows; demotion and deactivation bite at once. memory_put
      # stores content as given, dedupes on the scope's live hash, refuses
      # untrusted importance > 2, a scope outside the account and an
      # untrusted supersede of a verified item, and evicts over the cap
      # (superseded first, never verified), audited; recall candidates are
      # read-only and mark_recalled audits once per call; forget (a real
      # reason, at most 1000 chars), the TTL sweep and contact deletion
      # erase with counted audit rows; compaction supersedes every source
      # or nothing; audit append-only and no direct delete, the owner
      # included; only service_role executes the 11 API functions.
      - name: Verify CRM memory
        run: supabase db query --local --file supabase/ci/verify-crm-memory.sql
      # Migration 124's case SLA: config is owner/admin only, for a bank
      # of the account and a stage in its list; deadlines are snapshotted
      # at start, due soon in the last 20 % (or due_soon_minutes), overdue
      # from due_at; every stage move (case_open, case_set_stage, the v1
      # final status) restarts the configured timers and stops the
      # others, a customer message / bank response stops its timer, a
      # received document restarts or stops document_chase; the job logs
      # each change once as system; sla_state is the worst running state;
      # bank contacts are capped, never blank, append-only; the timeline
      # merges every kind in time order for readers only; no API role
      # writes a 124 table, only service_role executes the 8 public
      # functions; and 123's write lock stays FOR NO KEY UPDATE (FOR SHARE
      # deadlocked two concurrent document receipts).
      - name: Verify case SLA
        run: supabase db query --local --file supabase/ci/verify-case-sla.sql
      # Migration 125's coordinator inbox: case_inbox lists exactly the
      # cases case_can_read grants (owner/admin all, a lead their team's
      # agents', agent / coordinator their own; nobody else, no other
      # account); each filter selects what it names, sla_state from the
      # live timers at p_now, any other key, type or range FILTER_INVALID;
      # most_overdue / due_soonest / stalest order with the case id last,
      # keyset pages return every case once and a cursor is bound to its
      # sort and clock; the last touch ignores the SLA job's system rows;
      # STABLE, writes nothing, service_role only.
      - name: Verify case inbox
        run: supabase db query --local --file supabase/ci/verify-case-inbox.sql
      # Migration 126's bank workspaces: access is a live owner / admin of
      # the account, else a reader of an OPEN case of that bank, lapsing
