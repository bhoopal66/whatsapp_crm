name: Migrations

# Replaces the "Supabase Preview" check, which never worked: it fired
# only on migration changes and then either 404'd in four seconds
# ("Postgres config not found") or hung forever waiting on a branch
# action, because two stale dashboard integrations were pointed at this
# repo and neither could provision. It never applied a migration, so
# every `supabase/migrations/*.sql` file in this repo has shipped
# unexecuted by CI.
#
# This job does the thing that check only claimed to: boot a clean
# Postgres and replay every migration, in order, from nothing. It needs
# no secrets and no Supabase account — the CLI runs the database in a
# container on the runner.

on:
  pull_request:
    # `supabase/**` rather than `supabase/migrations/**` so a change to
    # config.toml re-runs the check too, and this workflow is listed so
    # that edits to the check are validated by the check.
    #
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned rather than `latest`: this check is infrastructure,
          # and a CLI release changing behaviour should be a deliberate
          # bump in a PR, not a Tuesday where main goes red.
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      # `db start` already applies the migrations on a cold volume, but
      # only on a cold volume — it is a no-op against a database that
      # already exists. `db reset` drops and rebuilds unconditionally,
      # so this step, not the one above, is the guarantee that every
      # migration ran in filename order against nothing. It fails on the
      # first statement Postgres rejects. --no-seed because there is no
      # seed script and this is about schema, not data.
      - name: Replay every migration from scratch
        run: supabase db reset --local --no-seed

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql

      # Schema checks prove the objects exist; they cannot prove the
      # money is right. The costing rules live inside
      # `record_whatsapp_message_cost` (migration 051) — the rate card,
      # the market map, the 2026-10-01 free tier, Meta's `billable`
      # override — so `npm test` cannot reach them and a wrong number
      # here is silent by nature: it under-reports spend and nothing
      # errors. This drives the function with real receipt shapes and
      # asserts the resulting ledger rows.
      - name: Verify the message-cost ledger
        run: supabase db query --local --file supabase/ci/verify-message-costs.sql

      # The TypeSafe decision layer (063) keeps its safety rules in SQL:
      # four-eyes policy activation, per-account isolation, an
      # append-only decision log whose only permitted change is the
      # retention purge. The vitest suite runs the checks against an
      # in-memory store, so none of that is reachable from `npm test`.
      - name: Verify the TypeSafe decision layer
        run: supabase db query --local --file supabase/ci/verify-typesafe.sql

      - name: Verify team activity
        run: supabase db query --local --file supabase/ci/verify-team-activity.sql

      # Team leaders (074) get Team activity scoped to their own team.
      # The scope is a filter inside the SQL report, so only real
      # Postgres can show a leader sees no one else's figures.
      - name: Verify team activity for team leaders
        run: supabase db query --local --file supabase/ci/verify-team-activity-leaders.sql

      # Deactivation (069) is enforced in the RLS helpers and the
      # profile guard, so a deactivated member's still-valid access
      # token reads nothing. Only real Postgres can show that.
      - name: Verify member deactivation
        run: supabase db query --local --file supabase/ci/verify-member-deactivation.sql

      # Team number allocation (071) derives whatsapp_channel_members
      # rows from team membership in triggers, so a team change grants
      # or revokes a number with no app code involved. Only real
      # Postgres can show the derivation, the cascades and the grants.
      - name: Verify team number allocation
        run: supabase db query --local --file supabase/ci/verify-team-numbers.sql

      # Chat tags (075): one main tag and one sub-tag of it per chat.
      # The pairing rule, the one-level nesting and the delete cascade
      # live in triggers and composite FKs, and the write rules in RLS,
      # so only real Postgres can show them.
      - name: Verify chat tags
        run: supabase db query --local --file supabase/ci/verify-chat-tags.sql

      # A contact's opt-out (076) is what every broadcast trusts to skip
      # a customer who asked to stop. Only an admin, the service role or
      # a server job may change it — a trigger, because contacts_update
      # lets any agent write the row — so only real Postgres can show an
      # agent is refused while other contact fields stay writable.
      - name: Verify contact opt-out
        run: supabase db query --local --file supabase/ci/verify-contact-opt-out.sql

      # AI agent v2 (077): a person's reply pauses the bot through a
      # messages trigger, and only an agent message with a sender_id
      # counts. Only real Postgres can show the trigger fires, refreshes
      # its own pause and leaves a hand-off alone.
      - name: Verify AI agent v2
        run: supabase db query --local --file supabase/ci/verify-ai-agent-v2.sql

      # Partner banks and needs-attention (078): partner_banks has a
      # shape CHECK and is written through the admin-only settings RLS,
      # and a person's reply clears ai_attention_at through 077's
      # messages trigger function — even with no AI config. Only real
      # Postgres can show the trigger and the policies.
      - name: Verify partner banks and needs-attention
        run: supabase db query --local --file supabase/ci/verify-partner-banks-attention.sql

      # Reply on every number (079): the switch is a NOT NULL boolean
      # defaulting to false, so an account that never saves it keeps the
      # routed-number bot.
      - name: Verify AI reply on every number
        run: supabase db query --local --file supabase/ci/verify-ai-all-numbers.sql

      # Pipelines for everyone (080): a deal is visible to its owner,
      # their team leader and admins, and tagging a chat with a stage's
      # linked tag opens one deal there. The rule lives in RLS and the
      # deal comes from a conversations trigger, so only real Postgres
      # can show who sees what and that re-tagging never duplicates.
      - name: Verify pipeline deals
        run: supabase db query --local --file supabase/ci/verify-pipeline-deals.sql

      # Approved answers (081): a placeholder can never be approved, the
      # bot's shortlist never returns internal-staff or unapproved rows,
      # and only admins write or import. All of it is a CHECK, a trigger,
      # RLS or a SECURITY DEFINER function, so only real Postgres can
      # show it.
      - name: Verify approved answers
        run: supabase db query --local --file supabase/ci/verify-approved-answers.sql

      # Edge security (084): the webhook replay keys, the sliding-window
      # rate limiter and the admin lockout are advisory-locked functions
      # over service-role-only tables. Only real Postgres can show the
      # window prunes, a lapsed claim is taken over, a success clears
      # only its own pair, and anon/authenticated are refused.
      - name: Verify edge security
        run: supabase db query --local --file supabase/ci/verify-edge-security.sql

      # Journey bot host (086): a commit lands file, event id and outbox
      # together, a replay is 'duplicate' whatever its version, and only
      # an agent who can see a customer touches their consent, with an
      # append-only history. Functions, triggers, RLS and grants: only
      # real Postgres can show it.
      - name: Verify journeys
        run: supabase db query --local --file supabase/ci/verify-journeys.sql

      # Workspaces (082-083): one person can hold a profile row in several
      # accounts and switch the active one; every existing policy keeps
      # meaning "the caller's ACTIVE account", and a bank guest is closed
      # out of all of them. Isolation is RLS plus SECURITY DEFINER
      # helpers, so only real Postgres can show it.
      - name: Verify workspaces
        run: supabase db query --local --file supabase/ci/verify-workspaces.sql

      # Workspace audit log (092): triggers on profiles and accounts write
      # one row per membership or settings change, with its actor, for
      # every writer (the RPCs, the service role, a hand-run UPDATE);
      # nobody can rewrite or delete a row, and only the workspace's live
      # admins read them. Also 092's accounts column grants. Triggers, RLS
      # and grants: only real Postgres can show it.
      - name: Verify workspace audit
        run: supabase db query --local --file supabase/ci/verify-workspace-audit.sql

      # Tasks (085): who sees a task is RLS (admins all, the assignee,
      # the creator, whoever can see its contact, a leader their team),
      # and a trigger vets the assignee, freezes a task's identity and
      # stamps completion for every writer, the service role included.
      # Only real Postgres can show who sees what, that a redelivered
      # system task is refused and that assigning rings the bell.
      - name: Verify tasks
        run: supabase db query --local --file supabase/ci/verify-tasks.sql

      # Internal chat (087): channels, DMs, threads, mentions and shared
      # customer-chat cards are RLS plus SECURITY DEFINER functions over
      # membership in the channel's workspace. A bank guest sees a deal
      # room but never its Team notes; a shared card shows its live
      # status only to someone who can open the chat in the inbox. Only
      # real Postgres can show it.
      - name: Verify internal chat
        run: supabase db query --local --file supabase/ci/verify-internal-chat.sql

      # Internal chat (087), part 2: channel membership (D-B1), pins,
      # direct writes refused for every role, the audited admin read,
      # erasure, and the private chat-files bucket. RLS and SECURITY
      # DEFINER RPCs are the boundary, so only real Postgres can show it.
      - name: Verify internal chat (admin)
        run: supabase db query --local --file supabase/ci/verify-internal-chat-admin.sql

      # Team-chat channel administration (091): rename, archive and
      # remove for channel admins and workspace owner/admin (from inside
      # a private channel only, D-B1), a person's own mute (only a direct
      # mention rings) and the badges that leave muted unread out.
      - name: Verify chat channel admin
        run: supabase db query --local --file supabase/ci/verify-chat-channel-admin.sql

      # Phone system (089): who sees a call is RLS through
      # pbx_can_view_call (leaders all, the call's people, whoever can
      # see its contact; guests nothing), three SECURITY DEFINER
      # functions re-check the caller, and a recording's play is logged
      # only while it is playable. Only real Postgres can show it.
      - name: Verify phone system
        run: supabase db query --local --file supabase/ci/verify-pbx.sql

      # Deal rooms (088): WhatsApp groups on the Meta number, linked to a
      # contact. Consent before any group, at most 8 members, opted-out
      # and do-not-contact people refused, bank guests per bank and with
      # a leader's approval, guests kept to the roster and group
      # messages, no phone or invite link readable by any client, and the
      # service-role functions. RLS, column grants and SECURITY DEFINER
      # functions are the boundary, so only real Postgres can show it.
      - name: Verify deal rooms
        run: supabase db query --local --file supabase/ci/verify-deal-rooms.sql

      # Video meetings (106): who sees a meeting is meeting_can_view
      # (owner/admin, the host, an invitee, or the workspace when it is
      # open; a bank guest nothing), a guard freezes host and workspace
      # and makes ended/cancelled terminal for every writer, participant
      # rows are service-role only, and an invitation rings the bell.
      # 107: in-room chat and reactions read as the meeting is, posted
      # only through meeting_post_message (visible, scheduled, a valid
      # kind and body, rate-limited), and the seat's hand and moderation
      # columns stay service-role only.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify meetings
        run: supabase db query --local --file supabase/ci/verify-meetings.sql

      # Web push (109): no client reads the outbox and the dispatcher's
      # functions are the service role's; a person manages only their own
      # devices and preferences; every writer skips a person with no
      # device, push or the kind switched off, or no live profile; bell
      # rows push (never the chat_* types), team-chat messages push every
      # reader but the author (a muted member only when @mentioned, a bank
      # guest never from deal-room notes), WhatsApp inbound goes to the
      # assignee, else the number's people, else owners and admins.
      - name: Verify push
        run: supabase db query --local --file supabase/ci/verify-push.sql
      # Calendar (108): who sees an event is calendar_event_can_view
      # (creator, attendees, the workspace when it is 'workspace', and
      # owner/admin unless 'private'; a bank guest nothing), only the
      # creator edits it (admins included), an attendee writes only their
      # own response and reminders, the invite / update / cancel /
      # response bells reach the right people, and the reminder sweep
      # rings once per key and never a declined attendee.
      # RLS, triggers and grants: only real Postgres can show it.
      - name: Verify calendar
        run: supabase db query --local --file supabase/ci/verify-calendar.sql
